<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timesheets</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
      background: #f7f7f8;
      color: #222;
    }
    h1 { font-size: 1.6rem; }
    h2 { font-size: 1.2rem; margin-top: 0; }
    section {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin: 10px 0 4px;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      font: inherit;
      border: 1px solid #bbb;
      border-radius: 4px;
    }
    textarea { min-height: 60px; resize: vertical; }
    button {
      margin-top: 12px;
      padding: 8px 16px;
      font: inherit;
      border: none;
      border-radius: 4px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { background: #93a4c8; cursor: wait; }
    .search-row { display: flex; gap: 8px; align-items: flex-end; }
    .search-row input { flex: 1; }
    .search-row button { margin-top: 0; }
    .status { margin-top: 10px; min-height: 1.2em; }
    .status.error { color: #b91c1c; }
    .status.ok { color: #15803d; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td {
      border-bottom: 1px solid #e5e5e5;
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }
    th { background: #f0f0f2; }
    td.amount, th.amount { text-align: right; white-space: nowrap; }
    tfoot td {
      font-weight: 700;
      border-top: 2px solid #999;
      border-bottom: none;
      background: #f0f0f2;
    }
    #saveButton { background: #15803d; }
    #saveButton:disabled { background: #9cc5aa; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>Timesheets</h1>

  <section>
    <h2>Add a Record</h2>
    <form id="addForm">
      <label for="day">Day of the Week</label>
      <input type="text" id="day" name="day" required>

      <label for="date">Date</label>
      <input type="text" id="description" name="date" maxlength="15" required>

      <label for="start">Start</label>
      <input type="text" id="start" name="start" maxlength="15" required>

      <label for="lunch">Lunch</label>
      <input type="text" id="lunch" name="lunch" maxlength="15" required>

      <label for="end_time">End</label>
      <input type="text" id="end_time" name="end_time" maxlength="15" required>

      <button type="submit" id="addButton">Add Record</button>
      <div id="addStatus" class="status"></div>
    </form>
  </section>

  <section>
    <h2>Save form</h2>
    <form id="searchForm" class="search-row">
      
      <button type="button" id="saveButton" disabled>Save PDF</button>
    </form>
    <div id="searchStatus" class="status"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Day of the Week</th>
            <th>Date</th>
            <th>Start</th>
            <th>Lunch</th>
            <th>End</th>
          </tr>
        </thead>
        <tbody id="recordsBody"></tbody>
        
      </table>
    </div>
  </section>

  <!-- jsPDF + AutoTable build the PDF download in the browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script>
    const API_URL = "https://4g3cy4kmdc.execute-api.us-east-1.amazonaws.com/default/acctPayableTest";

    const addForm = document.getElementById("addForm");
    const addButton = document.getElementById("addButton");
    const addStatus = document.getElementById("addStatus");    
    const saveButton = document.getElementById("saveButton");
    const recordsBody = document.getElementById("recordsBody");
    
    // Records currently shown in the table, used by the Save button
    let currentRecords = [];

    function setStatus(el, message, type) {
      el.textContent = message;
      el.className = "status" + (type ? " " + type : "");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Builds a PDF of the table (including the total row) and downloads it
    function saveRecords() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: "landscape", unit: "pt", format: "letter" });
      const today = new Date().toISOString().slice(0, 10);
      const search = document.getElementById("search").value.trim();

      doc.setFontSize(16);
      doc.text("Timesheets", 40, 40);
      doc.setFontSize(10);
      doc.text(`Generated ${today}` + (search ? `  |  Search: ${search}` : ""), 40, 58);

      doc.autoTable({
        startY: 72,
        head: [["Day", "Date", "Start", "Lunch", "End"]],
        body: currentRecords.map(r => [
          r.day ?? "",
          r.date ?? "",
          r.start ?? "",
          r.lunch ?? "",
          r.end_time ?? ""
        ]),
        foot: [["Total", "", formatAmount(sumAmounts(currentRecords)), "", ""]],
        showFoot: "lastPage",
        styles: { fontSize: 9, cellPadding: 5, overflow: "linebreak" },
        headStyles: { fillColor: [37, 99, 235] },
        footStyles: { fillColor: [240, 240, 242], textColor: 20, fontStyle: "bold" },
        columnStyles: {
          0: { cellWidth: 70 },
          2: { halign: "right", cellWidth: 80 }
        },
        didParseCell: data => {
          if (data.section !== "body" && data.column.index === 2) data.cell.styles.halign = "right";
        }
      });

      doc.save(`timesheets-${today}.pdf`);
    }

    // Reads the response body and throws with the Lambda's error message on failure
    async function readResponse(response) {
      let data = {};
      try {
        data = await response.json();
      } catch (e) {
        // Non-JSON body (e.g. API Gateway timeout page)
      }
      if (!response.ok) {
        throw new Error(data.error || data.message || `Request failed (HTTP ${response.status})`);
      }
      return data;
    }

    async function loadRecords() {
      const search = document.getElementById("search").value.trim();
      const url = search ? `${API_URL}?search=${encodeURIComponent(search)}` : API_URL;

      searchButton.disabled = true;
      saveButton.disabled = true;
      setStatus(searchStatus, "Loading records (Athena can take a few seconds)...");

      try {
        const response = await fetch(url, { method: "GET" });
        const data = await readResponse(response);
        const records = data.records || [];
        currentRecords = records;

        if (records.length === 0) {
          recordsBody.innerHTML = '<tr><td colspan="5">No records found.</td></tr>';
        } else {
          recordsBody.innerHTML = records.map(r => `
            <tr>
              <td>${escapeHtml(r.day)}</td>
              <td>${escapeHtml(r.date)}</td>
              <td>${escapeHtml(r.start)}</td>
              <td>${escapeHtml(r.lunch)}</td>
              <td>${escapeHtml(r.end_time)}</td>
            </tr>
          `).join("");
        }

        totalAmount.textContent = formatAmount(sumAmounts(records));
        saveButton.disabled = records.length === 0;
        setStatus(searchStatus, `${records.length} record(s) loaded.`, "ok");
      } catch (err) {
        console.error(err);
        currentRecords = [];
        totalAmount.textContent = formatAmount(0);
        setStatus(searchStatus, "Error: " + err.message, "error");
      } finally {
        searchButton.disabled = false;
      }
    }

    addForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const body = {
        day: document.getElementById("day").value.trim(),
        date: document.getElementById("date").value.trim(),
        start: document.getElementById("start").value.trim(),
        lunch: document.getElementById("lunch").value.trim(),
        end_time: document.getElementById("end_time").value.trim()
      };

      if (!body.day || !body.date) {
        setStatus(addStatus, "Day and date are required.", "error");
        return;
      }

      addButton.disabled = true;
      setStatus(addStatus, "Saving (Athena inserts can take several seconds)...");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        await readResponse(response);

        setStatus(addStatus, "Record added.", "ok");
        addForm.reset();
        loadRecords();
      } catch (err) {
        console.error(err);
        setStatus(addStatus, "Error: " + err.message, "error");
      } finally {
        addButton.disabled = false;
      }
    });

    searchForm.addEventListener("submit", (event) => {
      event.preventDefault();
      loadRecords();
    });

    saveButton.addEventListener("click", saveRecords);

    loadRecords();
  </script>
<h2>
<a href="https://main.d1e8ezak22dffd.amplifyapp.com/">Return to Main Page</a>
</h2>
</body>
</html>
