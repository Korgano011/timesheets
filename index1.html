<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timesheets</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
      background: #f7f7f8;
      color: #222;
    }
    h1 { font-size: 1.6rem; }
    h2 { font-size: 1.2rem; margin-top: 0; }
    section {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin: 10px 0 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      font: inherit;
      border: 1px solid #bbb;
      border-radius: 4px;
    }
    button {
      margin-top: 12px;
      padding: 8px 16px;
      font: inherit;
      border: none;
      border-radius: 4px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    .status { margin-top: 10px; min-height: 1.2em; }
    .status.error { color: #b91c1c; }
    .status.ok { color: #15803d; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td {
      border-bottom: 1px solid #e5e5e5;
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }
    th { background: #f0f0f2; }
    #saveButton { background: #15803d; }
    #saveButton:disabled { background: #9cc5aa; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>Timesheets</h1>

  <section>
    <h2>Add a Row</h2>
    <form id="addForm">
      <label for="day">Day of the Week</label>
      <input type="text" id="day" name="day" required>

      <label for="date">Date</label>
      <input type="text" id="date" name="date" maxlength="15" required>

      <label for="start">Start</label>
      <input type="text" id="start" name="start" maxlength="15" required>

      <label for="lunch">Lunch</label>
      <input type="text" id="lunch" name="lunch" maxlength="15" required>

      <label for="end_time">End</label>
      <input type="text" id="end_time" name="end_time" maxlength="15" required>

      <button type="submit" id="addButton">Add Row</button>
      <div id="addStatus" class="status"></div>
    </form>
  </section>

  <section>
    <h2>Timesheet</h2>
    <button type="button" id="saveButton" disabled>Download PDF</button>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Day of the Week</th>
            <th>Date</th>
            <th>Start</th>
            <th>Lunch</th>
            <th>End</th>
          </tr>
        </thead>
        <tbody id="recordsBody">
          <tr><td colspan="5">No rows yet.</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- jsPDF + AutoTable build the PDF download in the browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script>
    const addForm = document.getElementById("addForm");
    const addStatus = document.getElementById("addStatus");
    const saveButton = document.getElementById("saveButton");
    const recordsBody = document.getElementById("recordsBody");

    // Rows currently shown in the table, used by the PDF button
    const records = [];

    function setStatus(el, message, type) {
      el.textContent = message;
      el.className = "status" + (type ? " " + type : "");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderTable() {
      recordsBody.innerHTML = records.map(r => `
        <tr>
          <td>${escapeHtml(r.day)}</td>
          <td>${escapeHtml(r.date)}</td>
          <td>${escapeHtml(r.start)}</td>
          <td>${escapeHtml(r.lunch)}</td>
          <td>${escapeHtml(r.end_time)}</td>
        </tr>
      `).join("");
      saveButton.disabled = records.length === 0;
    }

    // Builds a PDF of the table and downloads it
    function saveRecords() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: "landscape", unit: "pt", format: "letter" });
      const today = new Date().toISOString().slice(0, 10);

      doc.setFontSize(16);
      doc.text("Timesheets", 40, 40);
      doc.setFontSize(10);
      doc.text(`Generated ${today}`, 40, 58);

      doc.autoTable({
        startY: 72,
        head: [["Day", "Date", "Start", "Lunch", "End"]],
        body: records.map(r => [r.day, r.date, r.start, r.lunch, r.end_time]),
        styles: { fontSize: 9, cellPadding: 5, overflow: "linebreak" },
        headStyles: { fillColor: [37, 99, 235] }
      });

      doc.save(`timesheets-${today}.pdf`);
    }

    addForm.addEventListener("submit", (event) => {
      event.preventDefault();

      records.push({
        day: document.getElementById("day").value.trim(),
        date: document.getElementById("date").value.trim(),
        start: document.getElementById("start").value.trim(),
        lunch: document.getElementById("lunch").value.trim(),
        end_time: document.getElementById("end_time").value.trim()
      });

      renderTable();
      addForm.reset();
      document.getElementById("day").focus();
      setStatus(addStatus, "Row added.", "ok");
    });

    saveButton.addEventListener("click", saveRecords);
  </script>
<h2>
<a href="https://main.d3aa0oh4rm4fbf.amplifyapp.com/">Return to Main Page</a>
</h2>
</body>
</html>
